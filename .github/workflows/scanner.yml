
name: VOL 88 Fibo Sniper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug files
        run: |
          echo "ROOT DIRECTORY"
          pwd
          echo "FILES"
          ls -la
          echo "PYTHON FILES"
          find . -type f -iname "*.py"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scanner
        run: |
          python -c "import os; print(os.listdir('.'))"
          python ./Scanner.py
          
